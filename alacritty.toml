[colors]
  [colors.primary]
  background = "#282828"
  foreground = "#ebdbb2"

  [colors.cursor]
  text   = "#282828"
  cursor = "#ebdbb2"

  [colors.normal]
  black   = "#282828"
  red     = "#cc241d"
  green   = "#98971a"
  yellow  = "#d79921"
  blue    = "#458588"
  magenta = "#b16286"
  cyan    = "#689d6a"
  white   = "#a89984"

  [colors.bright]
  black   = "#928374"
  red     = "#fb4934"
  green   = "#b8bb26"
  yellow  = "#fabd2f"
  blue    = "#83a598"
  magenta = "#d3869b"
  cyan    = "#8ec07c"
  white   = "#ebdbb2"

[window]
option_as_alt = "OnlyLeft"

[keyboard]
bindings = [
  { key = "{", mods = "Command|Shift", chars = "\u001b[25~" },
  { key = "}", mods = "Command|Shift", chars = "\u001b[26~" },
  { key = "S", mods = "Command|Shift", chars = "\u001b[28~" },
]
